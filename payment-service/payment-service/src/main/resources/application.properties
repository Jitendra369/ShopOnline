spring.application.name=payment-service
server.port=8085


# PostgreSQL Database Configuration (create the database first: CREATE DATABASE ecomm_payment_db;)
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomm_payment_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Kafka (broker from product-service/docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka Consumer
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Kafka Topics
app.kafka.topic.order=order-events
app.kafka.topic.payment=payment-events

# Payment simulation
# a payment above this amount always fails ("limit exceeded")
app.payment.max-amount=50000
# share of the remaining payments that fail at random, 0.0 = never, 1.0 = always
app.payment.failure-rate=0.2
